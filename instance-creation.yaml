- name: roboshop instances management
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    image_id: ami-0220d79f3f480ecf5
    domain_name: testzpaaws.bond # replace with your domain
    action: create
    subnet_id: subnet-00cc1e5648d8fda5c
    vpc_id: vpc-09176331a5b3cdb2e          # <-- FILL IN: the VPC that contains the subnet above
    vpc_cidr: 10.0.0.0/16          # <-- FILL IN: that VPC's IPv4 CIDR range
  tasks:
  - name: create security groups
    amazon.aws.ec2_security_group:
      name: "roboshop-{{ item }}"
      description: "roboshop {{ item }}"
      vpc_id: "{{ vpc_id }}"
      region: us-east-1
      rules:
        - proto: tcp
          ports: [22]
          cidr_ip: 0.0.0.0/0
        - proto: -1
          cidr_ip: "{{ vpc_cidr }}"
    loop: "{{ instances + ['common'] }}"
    when: action == "create"

  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      region: us-east-1
      vpc_subnet_id: "{{ subnet_id }}"
      security_groups:
      - "roboshop-{{ item }}"
      - roboshop-common
      network:
        assign_public_ip: true
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:
    - action == "create"
    - item.item != "frontend"        # ← add this line

  - name: create r53 record for frontend
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" #testzpaaws.bond
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:
    - item.item == "frontend"
    - action == "create"

  - name: delete r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}" # mongodb.testzpaaws.bond
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete r53 record for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}" # testzpaaws.bond
      ttl: 1
      type: A
    loop: "{{ instances }}"
    when:
    - action == "delete"
    - item == "frontend"

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"