# Installs and configures Redis.
- name: Enable Redis module stream
  ansible.builtin.command: dnf module enable redis:7 -y
  changed_when: true
  # NOTE: stream name/version varies by OS; adjust if needed.

- name: Install Redis
  ansible.builtin.dnf:
    name: redis
    state: present

- name: Allow remote connections
  ansible.builtin.replace:
    path: /etc/redis/redis.conf       # some systems use /etc/redis.conf
    regexp: '127.0.0.1'
    replace: '0.0.0.0'
  notify: Restart Redis

- name: Turn off protected mode
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: 'protected-mode yes'
    replace: 'protected-mode no'
  notify: Restart Redis

- name: Start Redis and keep it on after reboots
  ansible.builtin.service:
    name: redis
    state: started
    enabled: yes
